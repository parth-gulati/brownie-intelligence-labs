<!DOCTYPE html>
<html class="light" lang="en">
<head>
    <meta charset="utf-8"/>
    <meta content="width=device-width, initial-scale=1.0" name="viewport"/>
    <title>Connect — Brownie Intelligence Labs</title>
    <script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;700;800&family=Space+Grotesk:wght@300;400;500;600;700&display=swap" rel="stylesheet"/>
    <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&display=swap" rel="stylesheet"/>
    <script>
      tailwind.config = {
        theme: { extend: {
          colors: {
            "primary": "#006b15", "primary-container": "#00fc40", "on-primary": "#d1ffc6", "on-primary-container": "#005a10",
            "secondary": "#8c00d8", "secondary-container": "#e9c4ff", "on-secondary-container": "#6f00ac",
            "surface": "#f7f7ef", "surface-container": "#e8e9e0", "surface-container-low": "#f1f1e9",
            "surface-container-highest": "#dcded4", "surface-container-lowest": "#ffffff",
            "on-background": "#2d2f2a", "on-surface": "#2d2f2a", "on-surface-variant": "#5b5c56",
            "outline": "#767771", "outline-variant": "#adaea6", "background": "#f7f7ef",
          },
          fontFamily: { "headline": ["Plus Jakarta Sans"], "body": ["Space Grotesk"], "label": ["Space Grotesk"] },
        }},
      }
    </script>
    <style>
        .blueprint-grid { background-image: linear-gradient(to right, rgba(173, 174, 166, 0.1) 1px, transparent 1px), linear-gradient(to bottom, rgba(173, 174, 166, 0.1) 1px, transparent 1px); background-size: 40px 40px; }
        .hand-drawn-border { border: 2px solid #2d2f2a; border-radius: 255px 15px 225px 15px/15px 225px 15px 255px; }
        .material-symbols-outlined { font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24; }
        body { background-color: #f7f7ef; }
    </style>
</head>
<body class="font-body text-on-surface selection:bg-primary-container selection:text-on-primary-container">

<nav class="fixed top-0 w-full z-50 flex justify-between items-center px-4 md:px-8 py-4 bg-[#f1f1e9]">
    <a href="index.html" class="text-lg md:text-2xl font-bold tracking-tighter text-stone-800 font-headline">BIL</a>
    <div class="flex items-center gap-4 md:gap-12">
        <a class="text-stone-500 font-medium font-label text-[10px] md:text-xs uppercase tracking-widest hover:text-purple-500 transition-colors" href="index.html">Labs</a>
        <a class="text-stone-500 font-medium font-label text-[10px] md:text-xs uppercase tracking-widest hover:text-purple-500 transition-colors" href="journey.html">Journey</a>
        <a class="text-stone-500 font-medium font-label text-[10px] md:text-xs uppercase tracking-widest hover:text-purple-500 transition-colors" href="stack.html">Stack</a>
        <a class="text-green-600 border-b-2 border-green-500 font-bold font-label text-[10px] md:text-xs uppercase tracking-widest" href="connect.html">Connect</a>
    </div>
</nav>

<main class="pt-32 pb-20 px-8 min-h-screen blueprint-grid relative overflow-hidden">
    <div class="absolute top-40 right-10 opacity-10 pointer-events-none transform rotate-12">
        <span class="material-symbols-outlined text-[12rem]">architecture</span>
    </div>

    <div class="max-w-6xl mx-auto grid grid-cols-1 lg:grid-cols-12 gap-16 items-start">
        <!-- Left -->
        <div class="lg:col-span-5 space-y-12">
            <div class="space-y-4">
                <span class="font-label text-xs font-bold uppercase tracking-[0.3em] text-secondary">Phase 01: Contact</span>
                <h1 class="font-headline text-6xl md:text-7xl font-extrabold leading-tight tracking-tighter text-on-surface">
                    Draft Your<br/>Next <span class="text-primary italic">Project</span>.
                </h1>
            </div>
            <div class="space-y-8 p-8 bg-surface-container-low rounded-xl relative">
                <div class="absolute -top-4 -right-4 bg-primary-container p-3 rounded-full shadow-lg transform rotate-12">
                    <span class="material-symbols-outlined text-on-primary-container">edit_note</span>
                </div>
                <div class="flex items-start gap-6">
                    <div class="w-12 h-12 flex items-center justify-center bg-surface-container-highest rounded-lg">
                        <span class="material-symbols-outlined text-secondary">location_on</span>
                    </div>
                    <div><p class="font-label text-xs uppercase text-outline-variant tracking-widest mb-1">Based In</p><p class="font-headline text-xl font-bold">Toronto, ON</p></div>
                </div>
                <div class="flex items-start gap-6">
                    <div class="w-12 h-12 flex items-center justify-center bg-surface-container-highest rounded-lg">
                        <span class="material-symbols-outlined text-primary">mail</span>
                    </div>
                    <div><p class="font-label text-xs uppercase text-outline-variant tracking-widest mb-1">Direct Line</p><p class="font-headline text-xl font-bold">viirasupport@gmail.com</p></div>
                </div>
            </div>
        </div>

        <!-- Right: Form -->
        <div class="lg:col-span-7 bg-surface-container-lowest p-8 md:p-12 hand-drawn-border shadow-xl relative">
            <div class="absolute top-2 left-2 w-4 h-4 border-t-2 border-l-2 border-outline-variant/30"></div>
            <div class="absolute top-2 right-2 w-4 h-4 border-t-2 border-r-2 border-outline-variant/30"></div>
            <div class="absolute bottom-2 left-2 w-4 h-4 border-b-2 border-l-2 border-outline-variant/30"></div>
            <div class="absolute bottom-2 right-2 w-4 h-4 border-b-2 border-r-2 border-outline-variant/30"></div>

            <form class="space-y-12" action="mailto:viirasupport@gmail.com" method="post" enctype="text/plain">
                <div class="space-y-6">
                    <div class="group relative">
                        <label class="font-label text-[10px] uppercase tracking-[0.2em] text-outline">0.1 Collaborator Name</label>
                        <input class="w-full bg-transparent border-0 border-b-2 border-outline-variant/20 focus:ring-0 focus:border-primary px-0 py-3 font-headline text-2xl placeholder:text-outline-variant/30 outline-none" placeholder="Who are you?" type="text" name="name"/>
                    </div>
                    <div class="group relative">
                        <label class="font-label text-[10px] uppercase tracking-[0.2em] text-outline">0.2 Contact Vector</label>
                        <input class="w-full bg-transparent border-0 border-b-2 border-outline-variant/20 focus:ring-0 focus:border-primary px-0 py-3 font-headline text-2xl placeholder:text-outline-variant/30 outline-none" placeholder="email@address.com" type="email" name="email"/>
                    </div>
                    <div class="group relative">
                        <label class="font-label text-[10px] uppercase tracking-[0.2em] text-outline">0.3 Project Brief</label>
                        <textarea class="w-full bg-transparent border-0 border-b-2 border-outline-variant/20 focus:ring-0 focus:border-primary px-0 py-3 font-body text-lg placeholder:text-outline-variant/30 outline-none resize-none" placeholder="What are we building?" rows="4" name="brief"></textarea>
                    </div>
                </div>
                <div class="flex flex-col md:flex-row items-center justify-between gap-8 pt-6">
                    <div class="flex items-center gap-4 text-outline-variant/60">
                        <span class="material-symbols-outlined text-sm">draw</span>
                        <span class="font-label text-[10px] uppercase tracking-widest">System Ready</span>
                    </div>
                    <button type="button" onclick="this.textContent='Coming Soon'" class="group relative px-10 py-5 bg-primary overflow-hidden transition-all hover:shadow-[0_0_30px_rgba(0,107,21,0.3)] active:scale-[0.98] rounded-xl font-label text-sm font-black uppercase tracking-[0.2em] text-on-primary">Initialize Connection</button>
                </div>
            </form>
        </div>
    </div>
</main>

<footer class="w-full py-12 px-8 flex flex-col md:flex-row justify-between items-center border-t border-stone-200/20 bg-[#f7f7ef]">
    <div class="text-lg font-bold text-stone-800 font-headline italic">Brownie Intelligence Labs</div>
    <div class="font-mono text-sm uppercase tracking-widest text-[#adaea6]">&copy; 2026 Brownie Intelligence Labs</div>
</footer>
</body>
</html>
